services:
  app:
    build:
      target: dev
    env_file: [.env]
    environment:
      NODE_ENV: development
      # Hot reload en Docker Desktop y WSL, donde los eventos del sistema de archivos no siempre llegan.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
  migrate:
    build:
      target: dev
    env_file: [.env]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
volumes:
  node_modules: {}
