services:
  app:
    build:
      target: dev
    env_file: [.env]
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next-cache:/app/.next
  migrate:
    build:
      target: dev
    env_file: [.env]
    # MongoDB (src/lib/sync-indexes.ts, lo crea app-setup.sh): crea los índices declarados de los modelos con tsx, nunca
    # borra uno. Si no, las migraciones de Prisma (sin Prisma instalado, falla: no hay nada que migrar).
    command: ["sh", "-c", "if [ -f src/lib/sync-indexes.ts ]; then exec npx --no-install tsx src/lib/sync-indexes.ts; else exec npx --no-install prisma migrate deploy; fi"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
volumes:
  node_modules: {}
  next-cache: {}
