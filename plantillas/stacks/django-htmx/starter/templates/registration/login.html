{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
  <h1>Entrar</h1>
  {# A plain POST (no HTMX): the login rotates the session and redirects to ?next= or LOGIN_REDIRECT_URL. #}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
