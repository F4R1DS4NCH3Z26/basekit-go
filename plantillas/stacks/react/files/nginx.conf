# nginx de producción para la SPA (generado por basekit). Corre sin root en el puerto 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts hashed files in /assets: they can be cached for a year. A missing one is a 404, never index.html.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html is never cached, so a deploy is visible on the next load.
    location = /index.html {
        expires -1;
    }

    # SPA fallback: any other route is resolved by the client router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
