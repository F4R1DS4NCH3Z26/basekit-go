[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
# Exact versions (repo rule), each at least 14 days old. Alembic and the drivers are runtime dependencies:
# the prod `migrate` service runs `alembic upgrade head`.
dependencies = [
    "fastapi[standard]==0.162.0",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "pymysql[rsa]==1.2.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2", "mypy==2.4.0", "httpx==0.28.1"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Agent files and docs hold Markdown with sample code: ruff must not reformat them.
extend-exclude = ["alembic/versions", ".agents", ".claude", ".opencode", ".hermes", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]   # S = reglas de seguridad (bandit)

[tool.ruff.lint.isort]
# The local alembic/ folder must not turn the alembic package into first-party code.
known-first-party = ["src"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
