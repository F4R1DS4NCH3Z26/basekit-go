# Base común. Se combina con compose.dev.yaml o compose.prod.yaml (+ compose.db.yaml / compose.redis.yaml). Usa `make`.
services:
  app:
    build:
      context: .
    security_opt: ["no-new-privileges:true"]
  migrate:
    build:
      context: .
    profiles: ["tools"]
    # SQL: migraciones de bin/migrate.php. MongoDB: crea los índices que declaran los módulos (Migrations/indexes.php),
    # nunca borra uno.
    command: ["sh", "-c", "if [ -f bin/mongo-indexes.php ]; then exec php bin/mongo-indexes.php; else exec php bin/migrate.php up; fi"]
    security_opt: ["no-new-privileges:true"]
