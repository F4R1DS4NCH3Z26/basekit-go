services:
  app:
    build:
      target: prod
    env_file: [.env.prod]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_SECURE_COOKIE: "true"
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    cap_drop: [ALL]
  migrate:
    build:
      target: prod
    env_file: [.env.prod]
    environment:
      APP_ENV: production
