name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test (incluye aceptación 9 con Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -count=1 ./...
      - name: los adaptadores de los agentes están al día con .agents/
        run: make agents-check

  windows:
    name: go test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build -o basekit.exe ./cmd/basekit
      - name: smoke del binario
        shell: pwsh
        run: |
          ./basekit.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./basekit.exe init "$env:RUNNER_TEMP\demo" --yes --no-external-skills --stack nextjs --agents claude-code,opencode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP\demo\AGENTS.md")) { throw "AGENTS.md no se creó" }
      - run: go test -count=1 ./...

  release-build:
    name: binarios de release (sin publicar)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/build-release.sh "0.0.0-ci.${GITHUB_SHA::7}"
      - run: cd dist && sha256sum -c checksums.txt
      - name: la versión del tag llega al binario
        run: |
          want="0.0.0-ci.${GITHUB_SHA::7}"
          tar -C "$RUNNER_TEMP" -xzf "dist/basekit_${want}_linux_amd64.tar.gz"
          got="$("$RUNNER_TEMP/basekit_${want}_linux_amd64/basekit" --version)"
          [ "$got" = "$want" ] || { echo "--version dio '$got', se esperaba '$want'"; exit 1; }

  install-sh:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # shellcheck comes preinstalled on the Ubuntu runner image.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/test-install.sh
      - name: instalación sin red desde una release falsa
        run: sh scripts/test-install.sh

  install-ps1:
    name: install.ps1 (Windows PowerShell 5.1 y PowerShell 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: instalación sin red desde una release falsa
        shell: pwsh
        run: ./scripts/test-install.ps1

  e2e:
    # Slow (every stack with Docker): not on pull requests, so a PR is quick to merge. It runs on every push to main
    # and by hand (workflow_dispatch), for example before tagging a release.
    if: github.event_name != 'pull_request'
    name: e2e ${{ matrix.env || 'dev' }} (${{ matrix.stack }}${{ matrix.db && format(' + {0}', matrix.db) || '' }})
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backend and fullstack stacks (the list is plantillas/stacks/*/stack.json, by kind).
          - stack: django
          - stack: django-htmx
          - stack: express
          - stack: fastapi
          - stack: flask
          - stack: gin
          - stack: go-native
          - stack: laravel
          - stack: nestjs
          - stack: nextjs
          - stack: node-native
          - stack: php-native
          - stack: python-native
          # Spring's new-app adds data-jpa (SPRING_DB=postgresql by default): it needs a database to start.
          - stack: spring
            db: postgres
          - stack: symfony
          # MongoDB, only on the stacks whose stack.json lists mongo in dbs (dev; the CI tests enforce the list).
          - { stack: nestjs, db: mongo }
          # Frontend stacks have no database: no db axis (init rejects --db and --redis for them).
          - stack: react
          - stack: vanilla-ts
          - stack: vue
          # Production images: non-root users, cap_drop and the SQLite volume must work together.
          - { stack: django, db: sqlite, env: prod }
          - { stack: django-htmx, db: sqlite, env: prod }
          - { stack: express, db: sqlite, env: prod }
          - { stack: fastapi, db: sqlite, env: prod }
          - { stack: flask, db: sqlite, env: prod }
          - { stack: gin, db: sqlite, env: prod }
          - { stack: go-native, db: sqlite, env: prod }
          - { stack: laravel, db: sqlite, env: prod }
          - { stack: nestjs, db: sqlite, env: prod }
          - { stack: nextjs, db: sqlite, env: prod }
          - { stack: node-native, db: sqlite, env: prod }
          - { stack: php-native, db: sqlite, env: prod }
          - { stack: python-native, db: sqlite, env: prod }
          - { stack: spring, db: postgres, env: prod }
          - { stack: symfony, db: sqlite, env: prod }
          - { stack: react, env: prod }
          - { stack: vanilla-ts, env: prod }
          - { stack: vue, env: prod }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Acceptance 12: make new-app + make dev (or make prod-up), answering on the stack healthcheck; in prod with
      # SQLite, the non-root app must also write its volume. Matrix values reach the test only through env, and a
      # job without a database passes "none", never an empty value.
      - name: make new-app, make dev o prod-up, y espera el healthcheck
        env:
          BASEKIT_E2E: "1"
          BASEKIT_E2E_STACK: ${{ matrix.stack }}
          BASEKIT_E2E_DB: ${{ matrix.db || 'none' }}
          E2E_TEST: ${{ matrix.env == 'prod' && 'TestProdAnswersHealthcheck' || 'TestDevAnswersHealthcheck' }}
          # Composer's make new-app downloads package zips from api.github.com; anonymous requests from shared
          # runners get 504s. Only the PHP jobs (Laravel, Symfony, PHP nativo) receive the (read-only) workflow token.
          COMPOSER_AUTH: ${{ contains(fromJSON('["laravel","symfony","php-native"]'), matrix.stack) && format('{{"github-oauth":{{"github.com":"{0}"}}}}', secrets.GITHUB_TOKEN) || '' }}
        run: go test -count=1 -timeout 35m -v -run "^${E2E_TEST}\$/^${BASEKIT_E2E_STACK}\$" ./internal/cli
