name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test (incluye aceptación 9 con Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -count=1 ./...

  windows:
    name: go test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build -o basekit.exe ./cmd/basekit
      - name: smoke del binario
        shell: pwsh
        run: |
          ./basekit.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./basekit.exe init "$env:RUNNER_TEMP\demo" --yes --no-external-skills --stack nextjs --agents claude-code,opencode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP\demo\AGENTS.md")) { throw "AGENTS.md no se creó" }
      - run: go test -count=1 ./...

  release-build:
    name: binarios de release (sin publicar)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/build-release.sh "0.0.0-ci.${GITHUB_SHA::7}"
      - run: cd dist && sha256sum -c checksums.txt
      - name: la versión del tag llega al binario
        run: |
          want="0.0.0-ci.${GITHUB_SHA::7}"
          tar -C "$RUNNER_TEMP" -xzf "dist/basekit_${want}_linux_amd64.tar.gz"
          got="$("$RUNNER_TEMP/basekit_${want}_linux_amd64/basekit" --version)"
          [ "$got" = "$want" ] || { echo "--version dio '$got', se esperaba '$want'"; exit 1; }

  e2e:
    name: aceptación 12 · ${{ matrix.stack }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        stack: [nextjs, fastapi, laravel, spring]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make new-app && make env && make dev, y espera el healthcheck
        env:
          BASEKIT_E2E: "1"
          BASEKIT_E2E_STACK: ${{ matrix.stack }}
        run: go test -count=1 -timeout 35m -v -run "TestDevAnswersHealthcheck/${{ matrix.stack }}$" ./internal/cli
